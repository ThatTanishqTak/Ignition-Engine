name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.4.357.0

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Version = "${{ env.VULKAN_SDK_VERSION }}"
          $Url = "https://sdk.lunarg.com/sdk/download/$Version/windows/vulkansdk-windows-X64-$Version.exe"
          Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:TEMP\vulkan-sdk.exe" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait

      - name: Set Vulkan SDK environment
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\Bin"

      - name: Configure
        run: cmake -B Build -A x64

      - name: Build
        run: cmake --build Build --config ${{ matrix.config }} --parallel

      - name: Upload Sandbox build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Sandbox-Release-Windows
          path: bin/Release-Windows-x86_64/Ignition
          if-no-files-found: error